# Análisis estático con SonarQube / SonarCloud (Fase 2, entregable 12).
# Local:   docker run --rm -e SONAR_HOST_URL=http://host.docker.internal:9000 -e SONAR_TOKEN=<token> \
#            -v "$(pwd):/usr/src" sonarsource/sonar-scanner-cli
# CI:      ver .github/workflows/ci.yml (requiere secretos SONAR_TOKEN y SONAR_HOST_URL).
sonar.projectKey=autoventas-crm
sonar.projectName=CRM AutoVentas GT
sonar.projectVersion=1.0.0
# Para SonarCloud descomente y ajuste:
# sonar.organization=su-organizacion

sonar.sourceEncoding=UTF-8
sonar.sources=backend/src,frontend/src,db/init
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*.js,frontend/src/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,frontend/public/**
sonar.coverage.exclusions=backend/src/server.js,backend/src/docs/**,frontend/src/**

# Cobertura de las pruebas del backend (npm run test:cov genera lcov).
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
