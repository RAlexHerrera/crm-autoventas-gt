# =============================================================
# CRM AutoVentas GT, S.A. — orquestación completa
#   docker compose up --build
#   Web:  http://localhost:4200     API: http://localhost:3000/api
#   Docs: http://localhost:3000/api/docs
# =============================================================
name: autoventas-crm

services:
  db:
    image: mysql:8.4
    container_name: autoventas-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Guatemala
    command:
      - --default-time-zone=-06:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${DB_PUERTO_HOST:-3307}:3306"
    volumes:
      - mysql_datos:/var/lib/mysql
      # Esquema + datos de ejemplo: se ejecutan solo cuando el volumen está vacío.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent && mysql -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1 FROM ventas LIMIT 1' $$MYSQL_DATABASE > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./backend
      target: runtime
    container_name: autoventas-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      LOGIN_MAX_INTENTOS: ${LOGIN_MAX_INTENTOS:-5}
      LOGIN_VENTANA_MINUTOS: ${LOGIN_VENTANA_MINUTOS:-15}
      IVA_PUNTOS_BASICOS: ${IVA_PUNTOS_BASICOS:-1200}
      VIGENCIA_COTIZACION_DIAS: ${VIGENCIA_COTIZACION_DIAS:-15}
    ports:
      - "${API_PUERTO_HOST:-3000}:3000"

  frontend:
    build:
      context: ./frontend
    container_name: autoventas-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PUERTO_HOST:-4200}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Pruebas automatizadas del backend contra MySQL real (base autoventas_test).
  # Uso: docker compose --profile test run --rm backend-test
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: autoventas_test
      JWT_SECRET: prueba_secreto_jwt_suficientemente_largo_para_tests_0123456789
      SCHEMA_DIR: /db/init
    volumes:
      - ./db/init:/db/init:ro

volumes:
  mysql_datos:
